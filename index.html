<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#0b5d1e">

    <title>Classic Cards</title>

    <link rel="manifest" href="manifest.json">
    <link rel="stylesheet" href="css/style.css">
</head>

<body>

    <main id="app">
        <section id="home-screen" class="screen">

            <div class="home-top">
                <h1>Classic Cards</h1>
                
                <div class="logo" aria-label="Classic Cards logo">
                    <span class="black-suit">♠</span>
                    <span class="red-suit">♥</span>
                    <span class="black-suit">♣</span>
                    <span class="red-suit">♦</span>
                </div>
            </div>
            
            <div class="home-buttons">
                <button type="button">Single Player</button>
                <button type="button">Multiplayer</button>
                <button type="button">Classic Cards Tour</button>
            </div>
        
        </section>
    </main>

    <script src="js/app.js"></script>

</body>
</html>
