<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#0b5d1e">

    <title>Classic Cards</title>

    <link rel="manifest" href="manifest.json">
    <link rel="stylesheet" href="css/style.css?v=3">
</head>

<body>

    <main id="app">

        <!-- Home Screen -->
        <section id="home-screen" class="screen home-screen active-screen">

            <div class="home-top">
                <h1>Classic Cards</h1>

                <div class="logo" aria-label="Classic Cards logo">
                    <span class="black-suit">♠</span>
                    <span class="red-suit">♥</span>
                    <span class="black-suit">♣</span>
                    <span class="red-suit">♦</span>
                </div>
            </div>

            <div class="home-buttons">
                <button type="button" id="single-player-button">
                    Single Player
                </button>

                <button type="button" id="multiplayer-button">
                    Multiplayer
                </button>

                <button type="button" id="tour-button">
                    Classic Cards Tour
                </button>
            </div>

        </section>


        <!-- Main Menu -->
        <section id="main-menu" class="screen menu-screen">

            <header class="menu-header">
                <h1>Classic Cards</h1>

                <button
                    type="button"
                    class="icon-button"
                    id="app-settings-button"
                    aria-label="App Settings"
                >
                    ⚙
                </button>
            </header>

            <div class="game-list">

                <div class="game-option">
                    <button type="button" class="game-button">
                        Crazy Eights
                    </button>

                    <button
                        type="button"
                        class="game-settings-button"
                        aria-label="Crazy Eights Game Settings"
                    >
                        ⚙
                    </button>
                </div>

                <div class="game-option">
                    <button type="button" class="game-button">
                        Baccarat
                    </button>

                    <button
                        type="button"
                        class="game-settings-button"
                        aria-label="Baccarat Game Settings"
                    >
                        ⚙
                    </button>
                </div>

                <div class="game-option">
                    <button type="button" class="game-button">
                        Blackjack
                    </button>

                    <button
                        type="button"
                        class="game-settings-button"
                        aria-label="Blackjack Game Settings"
                    >
                        ⚙
                    </button>
                </div>

                <div class="game-option">
                    <button type="button" class="game-button">
                        Solitaire
                    </button>

                    <button
                        type="button"
                        class="game-settings-button"
                        aria-label="Solitaire Game Settings"
                    >
                        ⚙
                    </button>
                </div>

                <div class="game-option">
                    <button type="button" class="game-button">
                        Speed
                    </button>

                    <button
                        type="button"
                        class="game-settings-button"
                        aria-label="Speed Game Settings"
                    >
                        ⚙
                    </button>
                </div>

                <div class="game-option">
                    <button type="button" class="game-button">
                        Five Card Draw
                    </button>

                    <button
                        type="button"
                        class="game-settings-button"
                        aria-label="Five Card Draw Game Settings"
                    >
                        ⚙
                    </button>
                </div>

                <div class="game-option">
                    <button type="button" class="game-button">
                        Texas Hold'em
                    </button>

                    <button
                        type="button"
                        class="game-settings-button"
                        aria-label="Texas Hold'em Game Settings"
                    >
                        ⚙
                    </button>
                </div>

                <div class="game-option">
                    <button type="button" class="game-button">
                        Rummy
                    </button>

                    <button
                        type="button"
                        class="game-settings-button"
                        aria-label="Rummy Game Settings"
                    >
                        ⚙
                    </button>
                </div>

                <div class="game-option">
                    <button type="button" class="game-button">
                        Gin Rummy
                    </button>

                    <button
                        type="button"
                        class="game-settings-button"
                        aria-label="Gin Rummy Game Settings"
                    >
                        ⚙
                    </button>
                </div>

                <div class="game-option">
                    <button type="button" class="game-button">
                        Hearts
                    </button>

                    <button
                        type="button"
                        class="game-settings-button"
                        aria-label="Hearts Game Settings"
                    >
                        ⚙
                    </button>
                </div>

                <div class="game-option">
                    <button type="button" class="game-button">
                        Spades
                    </button>

                    <button
                        type="button"
                        class="game-settings-button"
                        aria-label="Spades Game Settings"
                    >
                        ⚙
                    </button>
                </div>

                <div class="game-option">
                    <button type="button" class="game-button">
                        Euchre
                    </button>

                    <button
                        type="button"
                        class="game-settings-button"
                        aria-label="Euchre Game Settings"
                    >
                        ⚙
                    </button>
                </div>

            </div>

        </section>
        <!-- Crazy Eights Game Screen -->
        <section id="crazy-eights-screen" class="screen game-screen">
           
            <header class="game-header">
                
                <h1>Crazy Eights</h1>
                
                <button
                    type="button"
                    class="icon-button"
                    id="crazy-eights-settings-button"
                    aria-label="Crazy Eights In-Game Settings"
                    
                >
                    ⚙
                </button>
            
            </header>
            
            <div class="game-table">
                
                <p class="game-placeholder">
            Crazy Eights
                
                </p>
                
                <button
                    type="button"
                    id="crazy-eights-return-button"
                    
                >
                    Return To Menu
                </button>
            
            </div>
        
        </section>

        <!-- Crazy Eights In-Game Settings -->
        <section
            id="crazy-eights-in-game-settings"
            class="screen settings-screen"
            
        >
            <header class="settings-header">
                
                <h1>Crazy Eights</h1>
                
                <button
                    type="button"
                    class="icon-button settings-close-button"
                    id="crazy-eights-settings-close"
                    aria-label="Close settings"
                    
                >
                    ×
                </button>
            
            </header>
            
            <div class="settings-options">
                
                <button type="button" id="how-to-play-button">
            How To Play
                </button>
                
                <button type="button" id="tutorial-button">
            Tutorial
                </button>
                
                <button type="button" id="game-settings-button">
            Game Settings
                </button>
                
                <button type="button" id="return-to-menu-button">
            Return To Menu
                </button>
                
                <button type="button" id="return-to-home-button">
            Return To Home
                </button>
            
            </div>
        
        </section>

        <!-- Crazy Eights Game Settings -->
<section
    id="crazy-eights-game-settings"
    class="screen settings-screen"
>

    <header class="settings-header">

        <h1>Game Settings</h1>

        <button
            type="button"
            class="icon-button settings-close-button"
            id="crazy-eights-game-settings-close"
            aria-label="Close game settings"
        >
            ×
        </button>

    </header>

    <div class="game-settings-options">

        <div class="setting-group">

            <h2>Input Method</h2>

            <div class="setting-choices">

                <button
                    type="button"
                    class="choice-button selected"
                    data-setting="input-method"
                    data-value="tap"
                >
                    Tap
                </button>

                <button
                    type="button"
                    class="choice-button"
                    data-setting="input-method"
                    data-value="drag"
                >
                    Drag &amp; Drop
                </button>

            </div>

        </div>


        <div class="setting-group">

            <h2>AI Difficulty</h2>

            <div class="setting-choices">

                <button
                    type="button"
                    class="choice-button"
                    data-setting="ai-difficulty"
                    data-value="easy"
                >
                    Easy
                </button>

                <button
                    type="button"
                    class="choice-button selected"
                    data-setting="ai-difficulty"
                    data-value="medium"
                >
                    Medium
                </button>

                <button
                    type="button"
                    class="choice-button"
                    data-setting="ai-difficulty"
                    data-value="hard"
                >
                    Hard
                </button>

            </div>

        </div>


        <div class="setting-group">

            <h2>House Rules</h2>

            <button
                type="button"
                class="house-rules-button"
                id="crazy-eights-house-rules-button"
            >
                House Rules
            </button>

        </div>

    </div>

</section>

    </main>

    <script src="js/app.js?v=3"></script>

</body>
</html>
